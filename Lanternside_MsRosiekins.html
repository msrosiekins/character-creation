 * with a light LIST (the nearest 8..32 street lamps, windows, signs, headlights
 * chosen on the CPU each frame) on top of a faint moon key light and a sky/ground
 * hemisphere. Everything renders into a linear HDR target; bloom and a filmic
 * grade happen in the composite pass, so a lamp can be 20x brighter than a wall
 * and still land as a warm halo instead of a white blotch.
 *
 * Materials are procedural (material class per vertex): asphalt with cracks,
 * patches, tyre wear and puddles; brick with per-brick tone and mortar; concrete
 * slabs and stains; cobbles; wood grain; brushed and oxidised metal; plaster with
 * rain streaks. Every pattern fades out by screen-space derivative before it can
 * shimmer - at 300x180 a crack is sub-pixel, and sub-pixel detail is noise.
 *
 * Windows are interior-mapped rooms (back wall, sides, floor, ceiling, a lamp,
 * furniture silhouettes, blinds or curtains, a passer-by now and then) so no
 * building ever shows a dead black window. Wet ground samples a mirrored
 * reflection of the city, rippled by rain.
 */
(function (root) {
  'use strict';
  var AL = root.AL || (root.AL = {});

  var MAX_LIGHTS = 32;

  var COMMON = [
    'float hash1(float n) { return fract(sin(n * 127.1) * 43758.5453); }',
    'float hash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }',
    'float vnoise(vec2 p) { vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);',
    '  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y); }',
    'float fbm(vec2 p) { float a = 0.5, s = 0.0; for (int i = 0; i < 4; i++) { s += a * vnoise(p); p = p * 2.03 + 17.1; a *= 0.5; } return s; }',
    /* distance to the nearest cell edge (voronoi border) - cracks, cobble joints */
    'vec2 voro(vec2 p) { vec2 c = floor(p), f = fract(p); float d1 = 9.0, d2 = 9.0;',
    '  for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++) { vec2 o = vec2(float(x), float(y)); vec2 r = o + vec2(hash(c + o), hash(c + o + 7.3)) * 0.8 + 0.1 - f; float d = dot(r, r);',
    '    if (d < d1) { d2 = d1; d1 = d; } else if (d < d2) d2 = d; }',
    '  return vec2(sqrt(d1), sqrt(d2) - sqrt(d1)); }'
  ].join('\n');

  var WORLD_VS = [
    '#version 300 es',
    'precision highp float;',
    'layout(location=0) in vec3 aPos;',
    'layout(location=1) in vec3 aNrm;',
    'layout(location=2) in vec3 aCol;',
    'layout(location=3) in vec4 aAttr;',
    'layout(location=4) in vec4 iM0;',
    'layout(location=5) in vec4 iM1;',
    'layout(location=6) in vec4 iM2;',
    'layout(location=7) in vec4 iM3;',
    'layout(location=8) in vec4 iC1;',
    'layout(location=9) in vec4 iC2;',
    'layout(location=10) in vec4 iC3;',
    'layout(location=11) in vec3 aUV;',
    'uniform mat4 uVP;',
    'uniform mat4 uShadowVP;',
    'uniform float uTime;',
    'uniform float uWind;',
    'uniform float uOutline;',
    'uniform vec2 uRes;',
    'out vec3 vPos; out vec3 vNrm; out vec3 vCol; out vec4 vAttr; out vec4 vShadow; out float vFade; out float vIEmis; out vec3 vUV; flat out float vCell; out vec3 vTint2;',
    'void main() {',
    '  mat4 im = mat4(iM0, iM1, iM2, iM3);',
    '  vec4 wp = im * vec4(aPos, 1.0);',
    '  vec3 n = normalize(mat3(im) * aNrm);',
    '  if (aAttr.y > 0.0) {',
    '    float ph = uTime * 1.6 + wp.x * 0.55 + wp.z * 0.4;',
    '    float h = max(aPos.y, 0.0);',
    '    wp.x += sin(ph) * 0.04 * aAttr.y * uWind * (0.4 + h * 0.3);',
    '    wp.z += cos(ph * 0.83) * 0.03 * aAttr.y * uWind * (0.4 + h * 0.3);',
    '  }',
    '  int t = int(aAttr.w + 0.5);',
    '  int cls = int(aAttr.x + 0.5);',
    '  vec3 tint = t == 1 ? iC1.rgb : (t == 2 ? iC2.rgb : (t == 3 ? iC3.rgb : vec3(1.0)));',
    /* colours are authored display-referred; light them in linear. Window/shop/face params are data, not colour. */
    '  bool data = cls == 16 || cls == 22;',
    '  vCol = data ? aCol : pow(max(aCol * tint, vec3(0.0)), vec3(2.2));',
    '  vTint2 = pow(max(iC2.rgb, vec3(0.0)), vec3(2.2));',
    '  vIEmis = t == 3 ? iC3.a : (t == 2 ? iC2.a : 0.0);',
    '  vCell = iC2.a;',
    '  vFade = iC1.a;',
    '  vPos = wp.xyz; vNrm = n; vAttr = aAttr; vUV = aUV;',
    '  vShadow = uShadowVP * vec4(wp.xyz + n * 0.04, 1.0);',
    '  vec4 clip = uVP * wp;',
    '  if (uOutline > 0.0) {',
    '    vec4 cn = uVP * vec4(wp.xyz + n, 1.0);',
    '    vec2 d = cn.xy / cn.w - clip.xy / clip.w;',
    '    float dl = length(d);',
    '    if (dl > 1e-5) clip.xy += d / dl * uOutline * 2.0 / uRes * clip.w;',
    '    clip.z += 0.0004 * clip.w;',
    '  }',
    '  gl_Position = clip;',
    '}'
  ].join('\n');

  var WORLD_FS = [
    '#version 300 es',
    'precision highp float;',
    'precision highp sampler2DShadow;',
    'in vec3 vPos; in vec3 vNrm; in vec3 vCol; in vec4 vAttr; in vec4 vShadow; in float vFade; in float vIEmis; in vec3 vUV; flat in float vCell; in vec3 vTint2;',
    'uniform vec3 uMoonDir; uniform vec3 uMoonCol; uniform vec3 uSky; uniform vec3 uGnd; uniform vec3 uRimCol;',
    'uniform vec3 uFogCol; uniform vec3 uFog; uniform vec3 uCam; uniform float uTime;',
    'uniform float uWet; uniform float uRain; uniform float uEmis; uniform float uNeon; uniform float uLamp; uniform float uWinLit; uniform float uEnergy;',
    'uniform float uCharLift; uniform float uDim; uniform float uSnow;',
    'uniform sampler2DShadow uShadowMap; uniform float uShadowOn; uniform float uShadowSize;',
    'uniform float uOutline; uniform vec3 uOutlineCol;',
    'uniform sampler2D uAO; uniform vec4 uAORect; uniform float uAOOn; uniform float uFadeNear;',
    'uniform vec4 uLP[' + MAX_LIGHTS + ']; uniform vec4 uLC[' + MAX_LIGHTS + ']; uniform int uLN;',
    'uniform sampler2D uRefl; uniform float uReflOn; uniform vec2 uRes; uniform float uPass;',
    'uniform sampler2D uFace; uniform sampler2D uSign; uniform vec2 uSignGrid; uniform float uOutScale;',
    'out vec4 outColor;',
    COMMON,
    /* interleaved gradient noise: a fine, even dissolve instead of a visible checkerboard */
    'float bayer(vec2 p) { return fract(52.9829189 * fract(dot(floor(p), vec2(0.06711056, 0.00583715)))) * 0.94 + 0.03; }',
    'float shadowAt(vec4 s) {',
    '  if (uShadowOn < 0.5) return 1.0;',
    '  vec3 p = s.xyz / s.w * 0.5 + 0.5;',
    '  if (p.x < 0.0 || p.x > 1.0 || p.y < 0.0 || p.y > 1.0 || p.z > 1.0) return 1.0;',
    '  float t = 1.0 / uShadowSize, acc = 0.0;',
    '  for (int x = -1; x <= 1; x++) for (int y = -1; y <= 1; y++) acc += texture(uShadowMap, vec3(p.xy + vec2(float(x), float(y)) * t * 1.5, p.z - 0.0015));',
    '  return acc / 9.0;',
    '}',
    /* LOD weight for a procedural pattern of coordinate q: 1 = draw detail, 0 = it would alias */
    'float lodOf(vec2 q, float k) { return clamp(1.0 - length(fwidth(q)) * k, 0.0, 1.0); }',

    /* ---- interior-mapped window --------------------------------------------------- */
    /* uv 0..1 across the glass; seed = window identity; prm: x aspect (w/h), y depth, z style (0 house, 1 shop, 2 office) */
    'vec3 roomAt(vec3 P, vec3 N, vec3 V, vec2 uv, float seed, vec3 prm, out float litOut) {',
    '  float aspect = max(0.3, prm.x), depth = max(0.4, prm.y), style = prm.z;',
    '  float era = floor(uTime / (38.0 + seed * 7.0) + seed * 3.1);',
    '  float r0 = hash(vec2(seed, 1.7)), r1 = hash(vec2(seed, era)), r2 = hash(vec2(seed * 3.3, 2.9));',
    '  float lit = style > 0.5 ? 1.0 : step(r1, uWinLit);',
    '  litOut = lit;',
    '  float kind = r2 < 0.66 ? 0.0 : (r2 < 0.86 ? 1.0 : 2.0);', /* warm lamp | cool | TV */
    '  vec3 T = normalize(cross(vec3(0.0, 1.0, 0.0), N)); vec3 B = vec3(0.0, 1.0, 0.0);',
    '  if (abs(N.y) > 0.8) { T = vec3(1.0, 0.0, 0.0); B = normalize(cross(N, T)); }',
    '  vec3 d = -V; vec3 td = vec3(dot(d, T), dot(d, B), dot(d, N));',
    '  vec3 p0 = vec3(uv.x * aspect, uv.y, 0.0);',
    '  float tx = td.x > 0.0 ? (aspect - p0.x) / td.x : -p0.x / min(td.x, -1e-4);',
    '  float ty = td.y > 0.0 ? (1.0 - p0.y) / td.y : -p0.y / min(td.y, -1e-4);',
    '  float tz = (-depth) / min(td.z, -1e-4);',
    '  float t = min(min(tx, ty), tz);',
    '  vec3 h = p0 + td * t;',
    '  vec3 wall = mix(vec3(0.78, 0.62, 0.48), vec3(0.62, 0.66, 0.74), hash(vec2(seed, 5.0)));',
    '  if (style > 0.5) wall = vec3(0.85, 0.8, 0.72);',
    '  vec3 c; vec2 q;',
    '  if (t == tz) { q = vec2(h.x / aspect, h.y); c = wall;',
    /* back wall: a picture, a shelf, a plant - furniture as silhouettes */
    '    float pic = step(abs(q.x - (0.3 + r0 * 0.4)), 0.12) * step(abs(q.y - 0.62), 0.09);',
    '    c = mix(c, c * vec3(0.55, 0.5, 0.6), pic);',
    '    float shelf = step(abs(q.y - 0.42), 0.015) * step(abs(q.x - 0.72 + r0 * 0.3), 0.2);',
    '    c *= 1.0 - 0.5 * shelf;',
    '    float plant = step(length((q - vec2(0.15 + r2 * 0.1, 0.18)) * vec2(1.0, 0.7)), 0.13 + 0.03 * sin(atan(q.y - 0.18, q.x - 0.15) * 7.0));',
    '    c = mix(c, vec3(0.08, 0.12, 0.08), plant * step(0.4, r0));',
    '    if (style > 0.5) { float sh = step(fract(q.y * 4.0), 0.12) + step(fract(q.x * 3.0 + seed), 0.05); c = mix(c, vec3(0.3, 0.26, 0.24), clamp(sh, 0.0, 1.0) * 0.8);',
    '      vec2 g = floor(vec2(q.x * 9.0, q.y * 4.0)); c = mix(c, vec3(hash(g + seed), hash(g + 3.0), hash(g + 9.0)) * 0.9, step(0.35, fract(q.y * 4.0)) * step(0.2, hash(g + seed * 1.3)) * 0.7); }',
    '  } else if (t == ty) { q = vec2(h.x / aspect, -h.z / depth);',
    '    c = td.y < 0.0 ? mix(vec3(0.42, 0.3, 0.22), vec3(0.3, 0.22, 0.16), step(0.5, fract(q.x * 5.0))) : wall * 1.1;',
    '  } else { q = vec2(-h.z / depth, h.y); c = wall * 0.8; }',
    /* light falloff: a lamp near the back wall */
    '  vec3 lampP = vec3(aspect * (0.25 + r0 * 0.5), 0.72, -depth * 0.75);',
    '  float lamp = 1.0 / (1.0 + dot(h - lampP, h - lampP) * 5.0);',
    '  vec3 lc = kind < 0.5 ? vec3(1.0, 0.62, 0.3) : (kind < 1.5 ? vec3(0.62, 0.78, 1.0) : vec3(0.35, 0.55, 1.0));',
    '  float fl = kind > 1.5 ? 0.55 + 0.45 * vnoise(vec2(uTime * 3.0, seed * 10.0)) : 1.0;',
    '  if (style > 0.5) { lc = mix(vec3(1.0, 0.86, 0.66), vCol, 0.0); lamp = 0.9; fl = 1.0; }',
    '  vec3 room = c * lc * (0.22 + 1.25 * lamp) * fl * lit * 1.25;',
    /* a passer-by crosses the room now and then */
    '  float wt = fract(uTime / (19.0 + seed * 5.0) + seed);',
    '  float wx = (wt * 3.0 - 1.0) * aspect;',
    '  float tp = (-depth * 0.45) / min(td.z, -1e-4); vec3 hp = p0 + td * tp;',
    '  float body = step(abs(hp.x - wx), 0.09 * aspect + 0.05) * step(hp.y, 0.78) * step(0.08, hp.y) + step(length(vec2(hp.x - wx, (hp.y - 0.86) * 1.2)), 0.08);',
    '  room = mix(room, room * 0.12, clamp(body, 0.0, 1.0) * lit * step(wt, 0.34) * step(0.55, r2));',
    /* dark room: moonlit, faintly visible - never dead black */
    '  room += (c * uSky * 0.55 + vec3(0.02, 0.018, 0.03)) * (1.0 - lit);',
    /* at the glass: blinds or curtains */
    '  float cur = hash(vec2(seed, 11.0));',
    '  if (style < 0.5 && cur < 0.35) { float bl = step(0.55, fract(uv.y * 14.0)); room *= 1.0 - bl * 0.75 * step(uv.y, 0.35 + cur * 1.8); }',
    '  else if (style < 0.5 && cur < 0.7) { float cw = 0.18 + 0.1 * sin(uv.y * 3.0 + seed); float side = step(uv.x, cw) + step(1.0 - cw, uv.x);',
    '    vec3 cc = mix(vec3(0.85, 0.6, 0.45), vec3(0.55, 0.62, 0.85), hash(vec2(seed, 4.0))) * (0.85 + 0.15 * sin(uv.x * 60.0));',
    '    room = mix(room, cc * lc * (0.18 + 1.1 * lit) * fl, side * 0.92); }',
    '  return room;',
    '}',

    'vec3 lights(vec3 P, vec3 N, vec3 V, vec3 alb, float rough, float specK, float wrap) {',
    '  vec3 acc = vec3(0.0); float gloss = exp2(10.0 * (1.0 - rough) + 1.0);',
    '  for (int i = 0; i < ' + MAX_LIGHTS + '; i++) {',
    '    if (i >= uLN) break;',
    '    vec3 L = uLP[i].xyz - P; float d2 = dot(L, L); float r = uLP[i].w;',
    '    if (d2 > r * r) continue;',
    '    float x = d2 / (r * r); float win = (1.0 - x * x); win *= win;',
    '    float att = win / (d2 * 0.9 + 0.35);',
    '    vec3 l = L * inversesqrt(max(d2, 1e-4));',
    '    float ndl = dot(N, l);',
    '    float diff = max((ndl + wrap) / (1.0 + wrap), 0.0);',
    '    vec3 hv = normalize(l + V);',
    '    float sp = pow(max(dot(N, hv), 0.0), gloss) * (gloss + 2.0) / 8.0 * specK * step(0.0, ndl);',
    '    acc += uLC[i].rgb * uLC[i].a * att * (alb * diff + vec3(sp));',
    '  }',
    '  return acc;',
    '}',

    'void main() {',
    '  if (vFade < 0.999 && bayer(gl_FragCoord.xy) > vFade) discard;',
    '  if (uPass > 0.5 && vPos.y < -0.02) discard;',
    '  if (uFadeNear > 0.0 && uPass < 0.5 && vPos.y > 0.35 && uOutline <= 0.0) { float cd = length(uCam - vPos); float k = smoothstep(uFadeNear * 0.72, uFadeNear, cd); if (k < 0.999 && bayer(gl_FragCoord.xy * 1.37) > k) discard; }',
    '  if (uOutline > 0.0) { outColor = vec4(uOutlineCol * uOutScale, 1.0); return; }',
    '  int cls = int(vAttr.x + 0.5);',
    '  int tintc = int(vAttr.w + 0.5);',
    '  vec3 n = normalize(vNrm);',
    '  if (!gl_FrontFacing) n = -n;',
    '  vec3 V = normalize(uCam - vPos);',
    '  vec3 alb = vCol;',
    '  float rough = 0.85, specK = 0.25, wrap = 0.25;',
    '  float emis = vAttr.z;',
    '  vec3 emisCol = vec3(0.0);',
    '  float up = clamp(n.y, 0.0, 1.0);',
    '  vec3 an = abs(n); float hor = an.x > an.z ? vPos.z : vPos.x;',
    '  float wetK = uWet * smoothstep(0.55, 0.95, up);',  /* wet where rain lands */
    '  float puddle = 0.0; vec2 ripple = vec2(0.0);',
    '  float charK = (cls == 6 || cls == 7 || cls == 19 || cls == 20) ? 1.0 : 0.0;',

    /* ---- ground materials ---- */
    '  if (cls == 2) {',   /* asphalt */
    '    vec2 q = vPos.xz; float lod = lodOf(q * 3.0, 1.2);',
    '    float mott = fbm(q * 0.7) * 0.5 + vnoise(q * 9.0) * 0.5 * lod;',
    '    alb *= 0.82 + 0.3 * mott;',
    '    float patchv = hash(floor(q / vec2(2.3, 1.6) + 0.5)); alb *= mix(1.0, 0.8 + 0.35 * hash(floor(q / vec2(2.3, 1.6)) + 3.0), step(0.72, patchv));',
    '    alb *= 1.0 - 0.18 * smoothstep(0.45, 0.8, vnoise(vec2(q.x * 0.12, q.y * 3.2)));',  /* tyre wear */
    '    vec2 cr = voro(q * 1.1); alb *= 1.0 - 0.5 * smoothstep(0.035, 0.0, cr.y) * step(0.55, vnoise(q * 0.8)) * lod;',
    '    puddle = smoothstep(0.58, 0.68, fbm(q * 0.45 + 3.0)) * uWet;',
    '    rough = mix(0.92, 0.3, wetK); specK = 0.35;',
    '  } else if (cls == 12) {',   /* concrete: kerbs, pavements, slabs */
    '    vec2 q = up > 0.5 ? vPos.xz : vec2(hor, vPos.y); float lod = lodOf(q * 2.0, 1.2);',
    '    vec2 f = fract(q / 1.1); float seam = min(min(f.x, 1.0 - f.x), min(f.y, 1.0 - f.y));',
    '    alb *= mix(1.0, mix(0.7, 1.0, smoothstep(0.0, 0.025, seam)), lod);',
    '    alb *= 0.86 + 0.24 * fbm(q * 1.3) + 0.08 * (hash(floor(q / 1.1)) - 0.5);',
    '    alb *= 1.0 - 0.2 * smoothstep(0.55, 0.9, fbm(q * 0.5 + 11.0));',   /* stains */
    '    if (up > 0.5) puddle = smoothstep(0.64, 0.72, fbm(q * 0.5 + 7.0)) * uWet * 0.8;',
    '    rough = mix(0.85, 0.4, wetK); specK = 0.3;',
    '  } else if (cls == 13) {',   /* brick */
    '    vec2 sz = vec2(0.24, 0.085); vec2 q = vec2(hor, vPos.y) / sz; q.x += 0.5 * mod(floor(q.y), 2.0);',
    '    vec2 f = fract(q); float e = min(min(f.x, 1.0 - f.x) * sz.x, min(f.y, 1.0 - f.y) * sz.y); float lod = lodOf(q, 1.1);',
    '    vec3 mortar = vec3(0.62, 0.58, 0.54);',
    '    float bv = hash(floor(q)); vec3 bc = alb * (0.78 + 0.4 * bv) * (0.95 + 0.1 * vnoise(q * 3.0));',
    '    alb = mix(alb * 0.95, mix(mortar * alb * 1.6, bc, smoothstep(0.004, 0.011, e)), lod);',
    '    alb *= 1.0 - 0.35 * smoothstep(0.9, 0.0, vPos.y) * vnoise(vec2(hor * 2.0, 1.0));',   /* ground dirt */
    '    alb *= 1.0 - 0.25 * uWet * smoothstep(0.3, 0.8, vnoise(vec2(hor * 3.0, vPos.y * 0.3)));',   /* wet streaks */
    '    rough = mix(0.88, 0.55, uWet); specK = 0.2;',
    '  } else if (cls == 14) {',   /* cobbles / dressed stone */
    '    vec2 q = up > 0.5 ? vPos.xz / 0.22 : vec2(hor, vPos.y) / vec2(0.5, 0.3);',
    '    float lod = lodOf(q, 1.2);',
    '    if (up > 0.5) { vec2 v = voro(q); alb = mix(alb, alb * mix(0.35, 1.08, smoothstep(0.02, 0.18, v.y)) * (0.85 + 0.3 * hash(floor(q))), lod);',
    '      puddle = smoothstep(0.6, 0.7, fbm(vPos.xz * 0.5 + 5.0)) * uWet; }',
    '    else { q.x += 0.5 * mod(floor(q.y), 2.0); vec2 f = fract(q); float e = min(min(f.x, 1.0 - f.x), min(f.y, 1.0 - f.y)); alb = mix(alb, alb * mix(0.62, 1.0, smoothstep(0.0, 0.06, e)) * (0.88 + 0.24 * hash(floor(q))), lod); }',
    '    alb *= 0.9 + 0.2 * fbm(vPos.xz * 2.0 + vPos.y);',
    '    rough = mix(0.8, 0.22, wetK); specK = 0.35;',
    '  } else if (cls == 15) {',   /* wood */
    '    float q = (up > 0.5 ? vPos.x : vPos.y) / 0.16; float lod = lodOf(vec2(q), 1.4);',
    '    float grain = sin((hor + vPos.y) * 38.0 + fbm(vec2(hor, vPos.y) * 4.0) * 7.0) * 0.5 + 0.5;',
    '    alb *= mix(1.0, (0.84 + 0.18 * grain) * mix(0.7, 1.0, smoothstep(0.02, 0.08, min(fract(q), 1.0 - fract(q)))) * (0.86 + 0.28 * hash(vec2(floor(q), 2.0))), lod);',
    '    rough = mix(0.75, 0.45, uWet); specK = 0.2;',
    '  } else if (cls == 10) {',   /* metal */
    '    vec2 q = vec2(hor, vPos.y); float lod = lodOf(q * 20.0, 0.6);',
    '    alb *= 0.9 + 0.12 * vnoise(vec2(q.x * 2.0, q.y * 40.0)) * lod;',
    '    float rust = smoothstep(0.62, 0.85, fbm(q * 1.7 + vPos.z)) * smoothstep(1.6, 0.0, vPos.y);',
    '    alb = mix(alb, vec3(0.28, 0.14, 0.07), rust * 0.6);',
    '    rough = mix(0.38, 0.8, rust); specK = 0.9; wrap = 0.1;',
    '  } else if (cls == 0) {',   /* plaster / painted render */
    '    vec2 q = vec2(hor, vPos.y);',
    '    alb *= 0.9 + 0.14 * fbm(q * 1.4);',
    '    alb *= 1.0 - 0.16 * smoothstep(0.5, 0.85, fbm(vec2(q.x * 3.0, q.y * 0.35)));',   /* streaks under sills */
    '    rough = 0.9; specK = 0.12;',
    '  } else if (cls == 8) {',   /* roof / tile */
    '    float q = vPos.y / 0.1; float lod = lodOf(vec2(q, hor), 1.4);',
    '    alb *= mix(1.0, mix(0.72, 1.04, smoothstep(0.0, 0.3, fract(q + sin(hor * 14.0) * 0.15))) * (0.9 + 0.2 * hash(vec2(floor(q), floor(hor * 3.0)))), lod);',
    '    rough = mix(0.75, 0.35, uWet); specK = 0.3;',
    '  } else if (cls == 1) {',   /* foliage */
    '    alb *= 0.85 + 0.3 * vnoise(vPos.xz * 2.1 + vPos.y * 1.3);',
    '    wrap = 0.7; rough = 0.8; specK = 0.1;',
    '  } else if (cls == 6) {',   /* skin */
    '    wrap = 0.6; rough = 0.55; specK = 0.25;',
    '  } else if (cls == 7) {',   /* cloth: a fine weave that only exists close up */
    '    float lod = lodOf(vPos.xy * 80.0, 0.5);',
    '    alb *= 1.0 - 0.06 * lod * (sin(vPos.x * 260.0) * sin(vPos.y * 260.0 + vPos.z * 200.0));',
    '    wrap = 0.45; rough = 0.92; specK = 0.08;',
    '  } else if (cls == 19) {',   /* hair */
    '    wrap = 0.35; rough = 0.45; specK = 0.35;',
    '  } else if (cls == 3) {',   /* water */
    '    rough = 0.05; specK = 1.0; puddle = 1.0;',
    '  }',
    /* rain ripples in puddles and on wet ground */
    '  if ((puddle > 0.01 || wetK > 0.3) && uRain > 0.01) {',
    '    for (int k = 0; k < 2; k++) {',
    '      vec2 q = vPos.xz * (k == 0 ? 3.2 : 4.7) + float(k) * 7.7; vec2 c = floor(q); vec2 f = fract(q) - 0.5;',
    '      float ph = fract(uTime * (0.9 + 0.4 * float(k)) + hash(c));',
    '      vec2 o = (vec2(hash(c + 1.3), hash(c + 5.1)) - 0.5) * 0.5;',
    '      float d = length(f - o); float ring = sin((d - ph * 0.5) * 48.0) * smoothstep(0.5 * ph + 0.08, 0.5 * ph, d) * smoothstep(0.0, 0.05, d) * (1.0 - ph);',
    '      ripple += (f - o) / max(d, 1e-3) * ring * 0.35 * uRain;',
    '    }',
    '  }',
    '  alb *= 1.0 - 0.45 * max(wetK * 0.6, puddle);',   /* wet surfaces are darker */

    /* ---- snow (Old Town winter, special events) ---- */
    '  if (uSnow > 0.0 && charK < 0.5) { float s = smoothstep(0.5, 0.85, up) * uSnow; alb = mix(alb, vec3(0.8, 0.84, 0.9), s); rough = mix(rough, 0.7, s); }',

    '  vec3 lit = vec3(0.0);',
    '  float sh = shadowAt(vShadow);',
    '  float cao = 1.0;',
    '  if (uAOOn > 0.5 && vPos.y < 0.35) { vec2 auv = (vPos.xz - uAORect.xy) / uAORect.zw; cao = 1.0 - 0.5 * texture(uAO, auv).r; }',
    '  float ao = mix(0.62, 1.0, smoothstep(0.0, 1.4, vPos.y + 0.1)) * cao;',
    '  vec3 hemi = mix(uGnd, uSky, n.y * 0.5 + 0.5);',

    /* ---- self-lit classes ---- */
    '  if (cls == 16 || cls == 22) {',   /* window / shopfront */
    '    float wl; vec3 prm = vCol; if (cls == 22) prm.z = 1.0;',
    '    float lodw = clamp(1.0 - length(fwidth(vUV.xy)) * 3.5, 0.0, 1.0);',
    '    vec3 room = lodw > 0.01 ? roomAt(vPos, n, V, vUV.xy, vUV.z + 1.0, prm, wl) : vec3(0.0);',
    '    float era = floor(uTime / (38.0 + (vUV.z + 1.0) * 7.0) + (vUV.z + 1.0) * 3.1);',
    '    float avgLit = cls == 22 ? 1.0 : step(hash(vec2(vUV.z + 1.0, era)), uWinLit);',
    '    vec3 flat_ = avgLit * vec3(1.0, 0.66, 0.36) * 0.9 + uSky * 0.05;',
    '    room = mix(flat_, room, lodw);',
    '    float fr = 0.1 + 0.9 * pow(1.0 - max(dot(n, V), 0.0), 4.0);',
    '    vec3 refl = mix(uFogCol * 1.6, uSky * 1.4, 0.5 + 0.5 * vnoise(vPos.xy * 0.7 + vPos.z));',
    /* rain on the glass: beads and runs */
    '    if (uWet > 0.05) { vec2 dq = vUV.xy * vec2(9.0, 5.0) + vec2(0.0, uTime * 0.12); vec2 dv = voro(dq); float bead = smoothstep(0.12, 0.05, dv.x) * uWet; room *= 1.0 - 0.25 * bead; refl += bead * 0.3; }',
    '    lit = room * (1.0 - fr) + refl * fr + lights(vPos, n, V, vec3(0.02), 0.05, 1.0, 0.0);',
    '    emis = 0.0;',
    '  } else if (cls == 24) {',   /* far facade: a grid of windows in uv units (u = column, v = floor), lit by hash */
    '    vec2 cell = floor(vUV.xy); vec2 f = fract(vUV.xy);',
    '    float win = step(0.18, f.x) * step(f.x, 0.82) * step(0.28, f.y) * step(f.y, 0.86);',
    '    float lodw = clamp(1.0 - length(fwidth(vUV.xy)) * 1.6, 0.0, 1.0);',
    '    float era = floor(uTime / 45.0 + hash(cell + vUV.z));',
    '    float on = step(hash(cell * 1.37 + vUV.z + era * 0.013), uWinLit * 0.9);',
    '    float tone = hash(cell + vUV.z * 3.1);',
    '    vec3 wc = mix(vec3(1.0, 0.62, 0.3), vec3(0.62, 0.78, 1.0), step(0.72, tone)) * (0.5 + 0.8 * hash(cell + 9.0));',
    '    vec3 wall = alb * (hemi * ao + uMoonCol * 0.2) + lights(vPos, n, V, alb, 0.9, 0.1, 0.25);',
    '    vec3 glass = mix(uFogCol * 0.5 + uSky * 0.1, wc * 1.6, on);',
    '    lit = mix(wall, mix(wall, glass, win), lodw) + (1.0 - lodw) * wc * on * 0.35 * 1.6;',
    '    emis = 0.0;',
    '  } else if (cls == 17) {',   /* sign lettering from the atlas; background is dark enamel */
    '    vec2 g = uSignGrid; float cell = floor(vUV.z + 0.5);',
    /* canvas rows run top-down: t = (row + 1 - v) / rows */
    '    vec2 cuv = clamp(vUV.xy, 0.0, 1.0);',
    '    vec4 s = texture(uSign, vec2((mod(cell, g.x) + cuv.x) / g.x, (floor(cell / g.x) + 1.0 - cuv.y) / g.y));',
    '    float fl = 1.0 - 0.85 * step(0.985, vnoise(vec2(uTime * 7.0, cell))) * step(0.6, hash(vec2(cell, 3.0)));',
    '    vec3 base = vec3(0.015, 0.014, 0.02);',
    '    lit = base + (alb * (s.r * 5.5 + s.g * 0.8)) * uNeon * fl;',
    '    emis = 0.0;',
    '  } else if (cls == 20) {',   /* face decal: atlas channels R white, G iris, B ink, A cover */
    '    vec2 g = vec2(8.0, 8.0); float cell = floor(vCell + 0.5);',
    '    vec2 fc = clamp(vUV.xy, 0.004, 0.996);',
    '    vec4 f = texture(uFace, vec2((mod(cell, g.x) + fc.x) / g.x, (floor(cell / g.x) + 1.0 - fc.y) / g.y));',
    /* alpha test that loosens as the face shrinks, so small eyes do not mip away */
    '    float flod = log2(max(length(fwidth(vUV.xy)) * 128.0, 1e-3));',
    '    if (f.a < mix(0.45, 0.12, clamp(flod / 3.0, 0.0, 1.0))) discard;',
    '    vec3 iris = vTint2 * mix(1.35, 0.4, smoothstep(0.38, 0.66, vUV.y));',
    '    vec3 c = mix(vec3(0.95, 0.94, 0.96), iris, f.g); c = mix(c, vec3(0.03, 0.02, 0.03), f.b);',
    '    c = mix(c, vec3(1.35), f.r);',
    '    lit = c * (hemi * 0.9 + 0.22 + uCharLift * 0.35) + lights(vPos, n, V, c, 0.6, 0.2, 0.6) * 0.8;',
    '    lit += c * 0.08;',
    '    emis = 0.0;',
    '  } else {',
    '    vec3 moon = uMoonCol * max(dot(n, uMoonDir) * 0.8 + 0.2, 0.0) * sh;',
    '    lit = alb * (hemi * ao + moon * mix(1.0, cao, 0.5));',
    '    lit += lights(vPos, n, V, alb * ao, rough, specK, wrap);',
    /* characters: a gentle key from the camera side + city-coloured rim keep them readable at 300px */
    '    if (charK > 0.5) {',
    '      float rim = pow(1.0 - max(dot(n, V), 0.0), 3.0);',
    '      lit += uRimCol * rim * (0.12 + uCharLift * 0.25) * smoothstep(-0.2, 0.6, n.y + 0.3);',
    /* a soft key from the camera side: characters stay readable without looking lit by a flash */
    '      lit += alb * uCharLift * 0.55 * (0.35 + 0.65 * max(dot(n, normalize(V + vec3(0.0, 0.6, 0.0))), 0.0));',
    '      if (cls == 19) { float ring = smoothstep(0.35, 0.6, n.y) * smoothstep(0.95, 0.7, n.y) * (0.5 + 0.5 * max(dot(n, V), 0.0)); lit += (uRimCol + vec3(0.18)) * ring * 0.35 * (0.5 + uCharLift); }',
    '    }',
    '  }',

    /* ---- wet ground reflects the city ---- */
    '  float reflK = max(wetK * 0.26, puddle * 0.92) * (cls == 2 || cls == 12 || cls == 14 || cls == 3 || cls == 8 ? 1.0 : 0.0);',
    '  if (reflK > 0.01 && uPass < 0.5) {',
    '    float fr = 0.08 + 0.92 * pow(1.0 - max(dot(n, V), 0.0), 4.0);',
    '    vec3 rc;',
    '    if (uReflOn > 0.5) {',
    '      vec2 suv = gl_FragCoord.xy / uRes + ripple * 0.05 + vec2(0.0, (vnoise(vPos.xz * 4.0) - 0.5) * 0.004 * (1.0 - puddle));',
    '      float lodr = mix(4.2, 0.4, puddle);',
    '      rc = textureLod(uRefl, suv, lodr).rgb;',
    '    } else {',
    '      vec3 R = reflect(-V, normalize(n + vec3(ripple.x, 0.0, ripple.y)));',
    '      rc = mix(uFogCol, uSky, clamp(R.y, 0.0, 1.0)) * 1.2 + lights(vPos + R * 0.4, vec3(0.0, 1.0, 0.0), V, vec3(0.0), 0.08, 3.0, 0.0);',
    '    }',
    /* damp ground keeps its own colour and only picks up the bright things (lamps, signs, windows) */
    '    vec3 rcS = puddle > 0.3 ? rc : max(rc - vec3(0.12), vec3(0.0)) * 1.3;',
    '    lit = mix(lit, rcS, reflK * mix(0.5, 1.0, fr));',
    '  }',

    /* emissive: neon and lamps are HDR so the bloom finds them */
    '  if (cls == 5) { float fl = 0.92 + 0.08 * sin(uTime * 3.0 + vPos.x * 2.0); emisCol = alb * (emis + 1.0) * 4.2 * uNeon * fl * (1.0 + uEnergy * 0.4); }',
    '  else if (cls == 18) { emisCol = alb * max(emis, 1.0) * 6.0 * uLamp; }',
    '  else if (cls == 11) { emisCol = alb * (0.6 + 0.4 * sin(uTime * 1.5 + vPos.y * 4.0)) * 2.4 * uNeon; }',
    '  else if (emis > 0.0) { emisCol = alb * emis * 3.0 * uEmis; }',
    '  emisCol += alb * vIEmis * 3.0;',
    '  lit += emisCol;',
    '  lit *= uDim;',
    /* fog: distance + a low ground mist, tinted by the city */
    '  float d = length(uCam - vPos);',
    '  float fog = smoothstep(uFog.x, uFog.y, d) * 0.9;',
    '  float mist = uFog.z * exp(-max(vPos.y, 0.0) * 1.2) * smoothstep(3.0, 18.0, d);',
    '  lit = mix(lit, uFogCol, clamp(fog + mist, 0.0, 0.95));',
    '  outColor = vec4(lit * uOutScale, 1.0);',
    '}'
  ].join('\n');

  var DEPTH_VS = [
    '#version 300 es',
    'layout(location=0) in vec3 aPos;',
    'layout(location=4) in vec4 iM0; layout(location=5) in vec4 iM1; layout(location=6) in vec4 iM2; layout(location=7) in vec4 iM3;',
    'uniform mat4 uShadowVP;',
    'void main() { gl_Position = uShadowVP * (mat4(iM0, iM1, iM2, iM3) * vec4(aPos, 1.0)); }'
  ].join('\n');
  var DEPTH_FS = ['#version 300 es', 'precision mediump float;', 'out vec4 o;', 'void main() { o = vec4(1.0); }'].join('\n');

  /* Sky: a full-screen triangle. Gradient, moon + halo, stars dimmed by city glow,
   * clouds lit orange from below by the city, and a band of impossible distance -
   * thousands of towers with lit windows - that makes a small district feel huge. */
  var SKY_VS = [
    '#version 300 es',
    'layout(location=0) in vec2 aXY;',
    'out vec2 vXY;',
    'void main() { vXY = aXY; gl_Position = vec4(aXY, 0.9999, 1.0); }'
  ].join('\n');
  var SKY_FS = [
    '#version 300 es',
    'precision highp float;',
    'in vec2 vXY;',
    'uniform mat4 uInvVP; uniform vec3 uZenith; uniform vec3 uHorizon; uniform vec3 uGlow; uniform vec3 uCityGlow;',
    'uniform float uStars; uniform float uTime; uniform vec3 uMoonDir; uniform float uMoon; uniform float uCloud; uniform float uRain;',
    'uniform float uFar; uniform vec3 uFarCol; uniform float uWinLit; uniform float uOutScale; uniform float uPass; uniform vec4 uMeteor; uniform float uFlash;',
    'out vec4 o;',
    COMMON,
    'void main() {',
    '  vec4 a = uInvVP * vec4(vXY, -1.0, 1.0); vec4 b = uInvVP * vec4(vXY, 1.0, 1.0);',
    '  vec3 d = normalize(b.xyz / b.w - a.xyz / a.w);',
    '  if (uPass > 0.5) d.y = abs(d.y);',
    '  float h = clamp(d.y, -0.2, 1.0);',
    '  vec3 c = mix(uHorizon, uZenith, pow(smoothstep(-0.02, 0.6, h), 0.7));',
    '  c += uCityGlow * exp(-max(h, 0.0) * 9.0) * 0.9;',   /* light pollution at the horizon */
    '  float az = atan(d.x, -d.z);',
    /* stars */
    '  if (uStars > 0.0) {',
    '    vec3 q = floor(d * 220.0);',
    '    float sv = fract(sin(dot(q, vec3(12.9898, 78.233, 37.719))) * 43758.5453);',
    '    float st = step(0.9975, sv) * (0.6 + 0.4 * sin(uTime * (1.0 + sv * 3.0) + sv * 40.0));',
    '    c += vec3(0.85, 0.9, 1.0) * st * uStars * smoothstep(0.12, 0.5, h) * (1.0 - uCloud);',
    '  }',
    /* moon + halo */
    '  if (uMoon > 0.0) { float m = max(dot(d, uMoonDir), 0.0); float disc = smoothstep(0.99955, 0.99975, m);',
    '    vec3 md = normalize(d - uMoonDir * m); float crater = vnoise(md.xy * 900.0) * 0.25;',
    '    c += vec3(1.0, 0.97, 0.9) * disc * (2.6 - crater) * uMoon * (1.0 - uCloud * 0.7);',
    '    c += vec3(0.55, 0.62, 0.8) * (pow(m, 60.0) * 0.35 + pow(m, 8.0) * 0.06) * uMoon; }',
    /* clouds: a slow fbm deck, lit from below by the city and from above by the moon */
    '  if (h > 0.0) {',
    '    vec2 cp = d.xz / (d.y + 0.08) * 1.6 + vec2(uTime * 0.012, 0.0);',
    '    float cl = smoothstep(0.42 - uCloud * 0.35, 0.95, fbm(cp * 0.9) + 0.25 * fbm(cp * 3.1));',
    '    vec3 under = uCityGlow * 1.3 + uHorizon * 0.4; float mooned = pow(max(dot(d, uMoonDir), 0.0), 6.0) * uMoon;',
    '    vec3 cc = mix(under, uZenith * 1.6 + vec3(0.1) * mooned, smoothstep(0.0, 0.5, h));',
    '    c = mix(c, cc, cl * smoothstep(0.0, 0.08, h) * (0.35 + 0.6 * uCloud));',
    '  }',
    /* meteor (event): a bright streak along a great circle */
    '  if (uMeteor.w > 0.0) { vec3 md = normalize(vec3(uMeteor.x, uMeteor.y, -1.0)); float e = max(dot(d, md), 0.0); float line = smoothstep(0.9993, 1.0, e); c += vec3(0.9, 0.95, 1.0) * line * uMeteor.w * 3.0; }',
    /* the far city: tower silhouettes around the horizon with lit windows */
    '  if (uFar > 0.0) {',
    '    for (int L = 0; L < 2; L++) {',
    '      float fl = float(L); float cols = 70.0 + fl * 55.0; float x = az / 6.2832 * cols + fl * 13.0;',
    '      float id = floor(x); float hr = hash(vec2(id, fl * 7.0));',
    '      float top = (0.035 + 0.11 * hr * hr + 0.05 * step(0.93, hr)) * (1.0 - fl * 0.45) - 0.01;',
    '      float fx = fract(x); float edge = step(0.06, fx) * step(fx, 0.94);',
    '      float inside = step(h, top) * edge;',
    '      if (inside > 0.5) {',
    '        vec3 bc = mix(uFarCol, uHorizon, 0.35 + fl * 0.3);',
    '        vec2 wq = vec2(fx * (3.0 + floor(hr * 4.0)), h * (160.0 - fl * 50.0)); vec2 wc = floor(wq);',
    '        float win = step(0.3, fract(wq.x)) * step(0.35, fract(wq.y)) * step(hash(wc + id * 3.1), uWinLit * 0.55);',
    '        bc += vec3(1.0, 0.72, 0.42) * win * 0.9 * (1.0 - fl * 0.4);',
    '        bc += vec3(1.0, 0.2, 0.25) * step(top - 0.004, h) * step(0.8, hr) * (0.5 + 0.5 * sin(uTime * 2.0 + id));',
    '        c = mix(c, bc, uFar * (0.92 - fl * 0.25));',
    '      }',
    '    }',
    '  }',
    '  c += vec3(0.8, 0.85, 1.0) * uFlash;',
    '  o = vec4(max(c, vec3(0.0)) * uOutScale, 0.0);',
    '}'
  ].join('\n');

  /* Particles: instanced quads, shape drawn procedurally. HDR out, premultiplied.
   * inst: pos.xyz size | rgba | kind, rot, flat, stretch */
  var PART_VS = [
    '#version 300 es',
    'precision highp float;',
    'layout(location=0) in vec2 aCorner;',
    'layout(location=1) in vec4 iPos;',
    'layout(location=2) in vec4 iCol;',
    'layout(location=3) in vec4 iK;',
    'uniform mat4 uVP; uniform vec3 uCamR; uniform vec3 uCamU; uniform float uPass;',
    'out vec2 vUV; out vec4 vCol; flat out int vKind; out float vW;',
    'void main() {',
    '  float c = cos(iK.y), s = sin(iK.y);',
    '  vec2 q = vec2(aCorner.x * c - aCorner.y * s, aCorner.x * s + aCorner.y * c);',
    '  vec3 p;',
    '  int k = int(iK.x + 0.5);',
    '  float st = k == 2 ? iK.w : 0.0;',
    '  if (iK.z > 0.5) p = iPos.xyz + vec3(q.x, 0.0, q.y) * iPos.w;',
    '  else if (k == 2) p = iPos.xyz + (uCamR * q.x * iPos.w + vec3(0.0, 1.0, 0.0) * q.y * iPos.w * (1.0 + st));',
    '  else p = iPos.xyz + (uCamR * q.x + uCamU * q.y) * iPos.w;',
    '  vUV = aCorner; vCol = iCol; vKind = k; vW = iK.w;',
    '  gl_Position = uVP * vec4(p, 1.0);',
    '}'
  ].join('\n');
  var PART_FS = [
    '#version 300 es',
    'precision highp float;',
    'in vec2 vUV; in vec4 vCol; flat in int vKind; in float vW;',
    'uniform float uOutScale;',
    'out vec4 o;',
    'void main() {',
    '  vec2 p = vUV; float r = length(p), a = 0.0;',
    '  if (vKind == 0) { a = exp(-r * r * 4.0) * smoothstep(1.0, 0.7, r); }',            /* soft glow (light halo) */
    '  else if (vKind == 1) a = smoothstep(1.0, 0.55, r);',                               /* disc */
    '  else if (vKind == 2) a = smoothstep(0.35, 0.0, abs(p.x)) * smoothstep(1.0, 0.4, abs(p.y));', /* rain streak */
    '  else if (vKind == 3) { vec2 q = abs(p); a = smoothstep(0.08, 0.0, min(q.x * 0.35 + q.y, q.y * 0.35 + q.x) - 0.25); a = max(a, smoothstep(0.35, 0.0, r)); }', /* sparkle */
    '  else if (vKind == 4) { vec2 q = p * vec2(1.0, 1.6); a = smoothstep(1.0, 0.8, length(q)); }', /* leaf / paper */
    '  else if (vKind == 5) { vec2 q = p * 1.15; q.y += 0.25; float x = abs(q.x); float h = q.y - sqrt(max(x, 0.0)) * 0.6; a = smoothstep(0.95, 0.85, length(vec2(x, h * 1.15))); }', /* heart */
    '  else if (vKind == 6) a = smoothstep(1.0, 0.2, r) * 0.55;',                           /* blob shadow */
    '  else if (vKind == 7) { a = smoothstep(1.0, 0.92, max(abs(p.x), abs(p.y))); }',      /* confetti */
    '  else if (vKind == 8) { a = smoothstep(0.12, 0.0, abs(r - 0.8)) + smoothstep(0.7, 0.0, r) * 0.25; }', /* ring */
    '  else if (vKind == 9) { a = smoothstep(0.1, 0.0, abs(r - 0.7 * vW)) * (1.0 - vW); }', /* splash ring (flat) */
    '  else if (vKind == 10) { float s = exp(-r * r * 2.5); a = s * (0.6 + 0.4 * sin(p.x * 3.0 + p.y * 2.0 + vW * 6.0)); }', /* steam puff */
    '  else if (vKind == 11) { a = exp(-abs(p.y) * 3.0) * exp(-p.x * p.x * 30.0); }',   /* horizontal flare (headlight) */
    '  else a = smoothstep(1.0, 0.0, r);',

          main.add(G.box(0.62, 0.62, 0.7), { m: at(dxx, H, dz - 0.2), c: wall, cls: mat });
          main.add(G.gable(0.62, 0.7, 0.3, 0.05), { m: at(dxx, H + 0.62, dz - 0.2, Math.PI / 2), c: rc, cls: C.TILE });
          window1(main, at(dxx, H + 0.12, dz + 0.151), 0.36, 0.4, { frame: st.frame, wall: wall, wallCls: mat, sill: false, depth: 0.8 });
        }
      }
      top = H + rh;
      if (st.chimneys !== false) for (var ch = 0; ch < 2; ch++) {
        var chx = cx + (ch ? 0.3 : -0.3) * w, chz = cz - d * 0.15;
        main.add(G.box(0.3, 1.0, 0.3), { m: at(chx, H + rh * 0.3, chz), c: st.chimneyCol || [0.42, 0.25, 0.2], cls: C.BRICK });
        main.add(G.box(0.36, 0.08, 0.36), { m: at(chx, H + rh * 0.3 + 1.0, chz), c: [0.3, 0.3, 0.3], cls: C.CONCRETE });
        if (ctx && ch === 0) ctx.smoke(chx, H + rh * 0.3 + 1.1, chz);
      }
    } else {
      /* flat roof: parapet and rooftop clutter */
      main.add(G.box(w, 0.28, 0.1), { m: at(cx, H, bd.z1 - 0.05), c: st.trim || shade(wall, 1.1), cls: st.trimCls || C.CONCRETE });
      main.add(G.box(w, 0.28, 0.1), { m: at(cx, H, bd.z0 + 0.05), c: st.trim || shade(wall, 1.1), cls: st.trimCls || C.CONCRETE });
      main.add(G.box(0.1, 0.28, d), { m: at(bd.x0 + 0.05, H, cz), c: st.trim || shade(wall, 1.1), cls: st.trimCls || C.CONCRETE });
      main.add(G.box(0.1, 0.28, d), { m: at(bd.x1 - 0.05, H, cz), c: st.trim || shade(wall, 1.1), cls: st.trimCls || C.CONCRETE });
      if (st.clutter !== false) rooftop(decor, cx, H, cz, w, d, r, ctx, st);
    }
    anchors.top = top;
    /* fire escape zig-zag on one side */
    if (st.fire) fireEscape(decor, st.fire === 'left' ? bd.x0 : bd.x1, bd.z1 - d * 0.35, ground, floors, storey, st.fire === 'left' ? -1 : 1, st.metal || [0.15, 0.15, 0.17]);
    /* a downpipe at each front corner */
    [bd.x0 + 0.12, bd.x1 - 0.12].forEach(function (px) { decor.add(G.cylinder(0.035, 0.035, H, 6, false), { m: at(px, 0.1, bd.z1 + 0.05), c: st.pipe || [0.3, 0.3, 0.32], cls: C.METAL }); });
    return anchors;
  }

  function rooftop(b, cx, y, cz, w, d, r, ctx, st) {
    var n = Math.max(1, Math.round(w * d / 12));
    for (var i = 0; i < n; i++) {
      var px = cx + (r() - 0.5) * (w - 1.2), pz = cz + (r() - 0.5) * (d - 1.2), k = r();
      if (k < 0.35) { /* AC / condenser */
        b.add(G.roundBox(0.7, 0.45, 0.5, 0.03, 1), { m: at(px, y, pz, r() * 0.3), c: [0.6, 0.6, 0.6], cls: C.METAL });
        b.add(G.cylinder(0.18, 0.18, 0.02, 12), { m: at(px, y + 0.46, pz), c: [0.2, 0.2, 0.2], cls: C.METAL });
      } else if (k < 0.55) { /* water tank on legs */
        for (var lg = 0; lg < 4; lg++) b.add(G.cylinder(0.03, 0.03, 0.5, 4, false), { m: at(px + (lg % 2 ? 0.3 : -0.3), y, pz + (lg < 2 ? 0.3 : -0.3)), c: [0.2, 0.2, 0.2], cls: C.METAL });
        b.add(G.cylinder(0.45, 0.45, 0.8, 12), { m: at(px, y + 0.5, pz), c: st.tank || [0.35, 0.26, 0.2], cls: C.WOOD });
        b.add(G.cone(0.5, 0.3, 12), { m: at(px, y + 1.3, pz), c: [0.2, 0.2, 0.22], cls: C.METAL });
      } else if (k < 0.75) { /* antenna + red beacon */
        b.add(G.cylinder(0.02, 0.015, 1.4, 4, false), { m: at(px, y, pz), c: [0.3, 0.3, 0.32], cls: C.METAL });
        b.add(G.box(0.5, 0.02, 0.02), { m: at(px, y + 1.0, pz), c: [0.3, 0.3, 0.32], cls: C.METAL });
        b.add(G.sphere(0.04, 6), { m: at(px, y + 1.4, pz), c: [1.0, 0.1, 0.1], cls: C.NEON });
      } else if (k < 0.9) { /* vent stacks */
        for (var v = 0; v < 3; v++) b.add(G.cylinder(0.06, 0.06, 0.4 + v * 0.1, 8), { m: at(px + v * 0.2, y, pz), c: [0.45, 0.45, 0.47], cls: C.METAL });
        if (ctx && r() < 0.5) ctx.steam(px, y + 0.6, pz);
      } else { /* satellite dish */
        b.add(G.cylinder(0.03, 0.03, 0.4, 4, false), { m: at(px, y, pz), c: [0.3, 0.3, 0.3], cls: C.METAL });
        b.add(G.lathe([[0.01, 0], [0.22, 0.06], [0.3, 0.12]], 10, true), { m: at(px, y + 0.4, pz, r() * 6, 1, 1, 1, 1.0), c: [0.8, 0.8, 0.8], cls: C.METAL });
      }
    }
  }

  function fireEscape(b, x, z, ground, floors, storey, side, col) {
    var ox = x + side * 0.42;
    for (var f = 1; f < floors; f++) {
      var y = ground + (f - 1) * storey - 0.05;
      b.add(G.box(0.8, 0.04, 1.3), { m: at(ox, y, z), c: col, cls: C.METAL });
      /* railings */
      b.add(G.box(0.03, 0.03, 1.3), { m: at(ox + side * 0.39, y + 0.5, z), c: col, cls: C.METAL });
      for (var p = 0; p < 5; p++) b.add(G.box(0.02, 0.5, 0.02), { m: at(ox + side * 0.39, y, z - 0.6 + p * 0.3), c: col, cls: C.METAL });
      /* stair to the next landing */
      if (f < floors - 1) for (var s = 0; s < 7; s++) {
        var t = s / 7;
        b.add(G.box(0.34, 0.02, 0.14), { m: at(ox - side * 0.12, y + t * storey, z - 0.5 + t * 1.0), c: col, cls: C.METAL });
      }
    }
  }

  function door(b, m, col, o) {
    o = o || {};
    var w = o.w || 0.7, h = o.h || 1.25;
    b.add(G.box(w + 0.16, h + 0.1, 0.08), { m: under(m, at(0, 0, -0.02)), c: o.frame || [0.2, 0.2, 0.22], cls: C.METAL });
    b.add(G.box(w, h, 0.06), { m: under(m, at(0, 0, 0.0)), c: col, cls: C.WOOD });
    b.add(G.quad(w * 0.6, h * 0.35), { m: under(m, at(0, h * 0.55, 0.035)), c: [1.3, 0.9, 0], cls: C.WINDOW, seed: nextSeed() });
    b.add(G.sphere(0.03, 6), { m: under(m, at(w * 0.35, h * 0.46, 0.05)), c: [0.8, 0.7, 0.4], cls: C.METAL });
    b.add(G.box(w + 0.3, 0.06, 0.35), { m: under(m, at(0, -0.06, 0.15)), c: [0.5, 0.5, 0.5], cls: C.CONCRETE });
    if (o.lamp) {
      var lm = under(m, at(w / 2 + 0.22, h + 0.08, 0.1));
      b.add(G.box(0.1, 0.16, 0.1), { m: lm, c: [0.12, 0.12, 0.12], cls: C.METAL });
      b.add(G.box(0.07, 0.1, 0.07), { m: under(lm, at(0, 0.03, 0.02)), c: o.lamp, cls: C.LAMP });
      if (o.ctx) { var p = AL.math.apply(lm, 0, 0.1, 0.15, [0, 0, 0, 0]); o.ctx.light(p[0], p[1], p[2], o.lamp, 0.8, 2.2); }
    }
  }

  function awning(b, m, w, cols, depth) {
    depth = depth || 1.0;
    var n = Math.max(3, Math.round(w / 0.32));
    for (var i = 0; i < n; i++) {
      var x = -w / 2 + (i + 0.5) * w / n;
      b.add(G.box(w / n + 0.004, 0.035, depth), { m: under(m, at(x, 0.0, depth / 2 * 0.94, 0, 1, 1, 1, 0.34)), c: cols[i % cols.length], cls: C.CLOTH, wind: 0.08 });
    }
    /* scalloped valance */
    for (var k = 0; k < n; k++) b.add(G.box(w / n - 0.01, 0.16, 0.02), { m: under(m, at(-w / 2 + (k + 0.5) * w / n, -0.47, depth * 0.94 * Math.cos(0.34) - 0.02)), c: cols[k % cols.length], cls: C.CLOTH, wind: 0.2 });
    b.add(G.cylinder(0.02, 0.02, w, 6), { m: under(m, at(-w / 2, -0.3, depth * 0.9, 0, 1, 1, 1, 0, -Math.PI / 2)), c: [0.2, 0.2, 0.2], cls: C.METAL });
  }

  /* ---- streets ---------------------------------------------------------------------- */
  function streetlight(b, ctx, x, z, o) {
    o = o || {};
    var h = o.h || 2.6, post = o.post || [0.12, 0.13, 0.15], col = o.col || [1.0, 0.72, 0.42], yaw = o.yaw || 0;
    var m = at(x, o.y || 0, z, yaw);
    var headX = 0, headY = h;
    if (o.style === 'lantern') {
      /* old town: fluted post, lantern cage */
      b.add(G.lathe([[0.12, 0], [0.12, 0.25], [0.07, 0.35], [0.05, h - 0.3], [0.08, h - 0.2]], 8, true), { m: m, c: post, cls: C.METAL });
      b.add(G.lathe([[0.1, 0], [0.16, 0.08], [0.14, 0.4], [0.05, 0.5]], 6, true), { m: under(m, at(0, h - 0.2, 0)), c: post, cls: C.METAL });
      b.add(G.cylinder(0.11, 0.13, 0.32, 6), { m: under(m, at(0, h - 0.13, 0)), c: col, cls: C.LAMP });
      headY = h - 0.0;
    } else if (o.style === 'neon') {
      b.add(G.cylinder(0.05, 0.05, h, 8), { m: m, c: post, cls: C.METAL });
      b.add(G.box(0.05, h * 0.7, 0.05), { m: under(m, at(0, h * 0.2, 0.05)), c: o.neon || col, cls: C.NEON });
      b.add(G.roundBox(0.8, 0.06, 0.18, 0.02, 1), { m: under(m, at(0.3, h, 0)), c: post, cls: C.METAL });
      b.add(G.box(0.7, 0.02, 0.12), { m: under(m, at(0.3, h - 0.02, 0)), c: col, cls: C.LAMP });
      headX = 0.3;
    } else {
      /* modern cobra-head */
      b.add(G.cylinder(0.07, 0.045, h, 8), { m: m, c: post, cls: C.METAL });
      b.add(G.cylinder(0.1, 0.1, 0.35, 8), { m: m, c: post, cls: C.METAL });
      b.add(G.sweep([[0, h - 0.1, 0], [0.1, h + 0.08, 0], [0.4, h + 0.14, 0], [0.62, h + 0.1, 0]], 0.028, 5), { m: m, c: post, cls: C.METAL });
      b.add(G.roundBox(0.34, 0.07, 0.16, 0.03, 1), { m: under(m, at(0.62, h + 0.04, 0)), c: post, cls: C.METAL });
      b.add(G.box(0.28, 0.02, 0.11), { m: under(m, at(0.62, h + 0.03, 0)), c: col, cls: C.LAMP });
      headX = 0.62; headY = h + 0.02;
    }
    var hp = AL.math.apply(m, headX, headY, 0, [0, 0, 0, 0]);
    if (ctx) {
      ctx.light(hp[0], hp[1] - 0.08, hp[2], col, o.k || 3.2, o.r || 4.2, 'street');
      if (o.cone !== false) ctx.cone(hp[0], hp[1] - 0.05, hp[2], o.coneR || 0.95, hp[1] - 0.05, col);
      ctx.glow(hp[0], hp[1] - 0.04, hp[2], col, o.glow || 0.5);
    }
    return hp;
  }

  function trafficLight(b, ctx, x, z, yaw, o) {
    o = o || {};
    var m = at(x, 0, z, yaw || 0), post = [0.13, 0.14, 0.15];
    b.add(G.cylinder(0.05, 0.05, 2.3, 8), { m: m, c: post, cls: C.METAL });
    b.add(G.roundBox(0.2, 0.55, 0.16, 0.03, 1), { m: under(m, at(0, 1.7, 0.08)), c: [0.08, 0.08, 0.09], cls: C.METAL });
    /* the lamps: the scene drives which glows (instance mesh), these are dark lenses */
    [0, 1, 2].forEach(function (i) { b.add(G.cylinder(0.055, 0.055, 0.02, 10), { m: under(m, at(0, 2.13 - i * 0.17, 0.17, 0, 1, 1, 1, Math.PI / 2)), c: [0.12, 0.1, 0.1], cls: C.METAL }); });
    /* pedestrian signal box */
    b.add(G.roundBox(0.16, 0.2, 0.1, 0.02, 1), { m: under(m, at(0.1, 1.2, 0.06)), c: [0.08, 0.08, 0.09], cls: C.METAL });
    if (ctx) ctx.anchor('signal' + (o.id || ''), [x, z, yaw || 0]);
  }

  function bench(b, x, z, yaw, col, y, frame) {
    var m = at(x, y || 0, z, yaw || 0), leg = frame || [0.14, 0.14, 0.16];
    for (var s = 0; s < 3; s++) b.add(G.roundBox(1.05, 0.035, 0.1, 0.01, 1), { m: under(m, at(0, 0.38, -0.12 + s * 0.12)), c: col, cls: C.WOOD });
    for (var k = 0; k < 2; k++) b.add(G.roundBox(1.05, 0.08, 0.035, 0.01, 1), { m: under(m, at(0, 0.5 + k * 0.12, -0.2, 0, 1, 1, 1, -0.2)), c: col, cls: C.WOOD });
    [-0.44, 0.44].forEach(function (lx) {
      b.add(G.sweep([[lx, 0, 0.14], [lx, 0.38, 0.12], [lx, 0.38, -0.16], [lx, 0.72, -0.26]], 0.022, 4), { c: leg, cls: C.METAL, m: m });
      b.add(G.box(0.04, 0.38, 0.04), { m: under(m, at(lx, 0, -0.14)), c: leg, cls: C.METAL });
    });
  }
  function chair(b, x, z, yaw, col, y) {
    var m = at(x, y || 0, z, yaw || 0), leg = [0.12, 0.12, 0.13];
    b.add(G.roundBox(0.4, 0.05, 0.38, 0.02, 1), { m: under(m, at(0, 0.38, 0)), c: col, cls: C.WOOD });
    b.add(G.roundBox(0.4, 0.3, 0.04, 0.02, 1), { m: under(m, at(0, 0.45, -0.18, 0, 1, 1, 1, -0.12)), c: col, cls: C.WOOD });
    [[-0.16, -0.15], [0.16, -0.15], [-0.16, 0.15], [0.16, 0.15]].forEach(function (p) { b.add(G.cylinder(0.018, 0.018, 0.38, 4, false), { m: under(m, at(p[0], 0, p[1])), c: leg, cls: C.METAL }); });
  }
  function seating(b, col) {
    AL.layout.LOCATIONS.forEach(function (loc) {
      loc.spots.forEach(function (s) {
        if (s[2] !== 'sit') return;
        if (s[4] === 'chair') chair(b, s[0], s[1], s[3] || 0, col, loc.y || 0);
        else bench(b, s[0], s[1] - 0.1 * Math.cos(s[3] || 0), s[3] || 0, col, loc.y || 0);
      });
    });
  }
  function cafeTable(b, x, z, top, o) {
    o = o || {};
    var m = at(x, 0, z);
    b.add(G.cylinder(0.12, 0.14, 0.03, 10), { m: m, c: [0.12, 0.12, 0.13], cls: C.METAL });
    b.add(G.cylinder(0.025, 0.025, 0.68, 6), { m: m, c: [0.12, 0.12, 0.13], cls: C.METAL });
    b.add(G.cylinder(0.32, 0.32, 0.03, 14), { m: under(m, at(0, 0.68, 0)), c: top, cls: o.topCls || C.STONE });
    /* a candle jar and two cups */
    b.add(G.cylinder(0.035, 0.035, 0.07, 8), { m: under(m, at(0, 0.71, 0)), c: [1.0, 0.7, 0.35], cls: C.LAMP });
    b.add(G.cylinder(0.03, 0.025, 0.06, 8), { m: under(m, at(0.14, 0.71, 0.08)), c: [0.95, 0.93, 0.9] });
    b.add(G.cylinder(0.03, 0.025, 0.06, 8), { m: under(m, at(-0.13, 0.71, -0.1)), c: [0.95, 0.93, 0.9] });
    if (o.ctx) o.ctx.light(x, 0.85, z, [1.0, 0.62, 0.3], 0.35, 1.2, 'candle');
    if (o.parasol) {
      b.add(G.cylinder(0.02, 0.02, 1.9, 5), { m: m, c: [0.85, 0.85, 0.82], cls: C.METAL });
      b.add(G.lathe([[0.9, 0], [0.7, 0.15], [0.02, 0.36]], 8, true), { m: under(m, at(0, 1.72, 0)), c: o.parasol, cls: C.CLOTH, wind: 0.08 });
    }
  }
  function planter(b, x, z, w, d, plant, box, y) {
    if (!y) { var op = offPath(x, z, Math.max(w, d) * 0.5); x = op[0]; z = op[1]; }
    b.add(G.box(w, 0.4, d), { m: at(x, y || 0, z), c: box || [0.35, 0.35, 0.36], cls: C.CONCRETE });
    var r = U.rng('pl' + x + z), n = Math.max(2, Math.round(w * d * 8));
    for (var i = 0; i < n; i++) b.add(G.lumpy(G.sphere(0.12 + r() * 0.08, 7, 5), 0.03, i + 1), { m: at(x + (r() - 0.5) * (w - 0.15), (y || 0) + 0.34, z + (r() - 0.5) * (d - 0.15)), c: shade(plant, 0.8 + r() * 0.4), cls: C.FOLIAGE, wind: 0.4 });
  }
  function streetTree(b, x, z, s, leaf, trunk, seed) {
    var r = U.rng(seed || (x * 100 + z) | 0), m = at(x, 0, z, r() * 6.28, s);
    b.add(G.box(0.9, 0.04, 0.9), { m: at(x, -0.01, z), c: [0.1, 0.1, 0.11], cls: C.METAL });
    b.add(G.cylinder(0.08, 0.06, 1.3, 7), { m: m, c: trunk || [0.28, 0.2, 0.16], cls: C.WOOD });
    [[0.3, 1.2, 0.1, -0.6], [-0.25, 1.35, -0.05, 0.7]].forEach(function (br) { b.add(G.cylinder(0.035, 0.02, 0.5, 5), { m: under(m, at(br[0] * 0.4, br[1] - 0.3, br[2], 0, 1, 1, 1, 0, br[3])), c: trunk || [0.28, 0.2, 0.16], cls: C.WOOD }); });
    var blobs = [[0, 1.75, 0, 0.62], [0.42, 1.55, 0.2, 0.45], [-0.4, 1.6, -0.12, 0.48], [0.1, 2.1, -0.1, 0.42], [-0.1, 1.45, 0.35, 0.38]];
    for (var j = 0; j < blobs.length; j++) {
      var bl = blobs[j];
      b.add(G.lumpy(G.sphere(bl[3], 10, 7), 0.07, (seed || 1) + j), { m: under(m, at(bl[0], bl[1] - bl[3], bl[2])), c: shade(leaf, 0.85 + j * 0.06), cls: C.FOLIAGE, wind: 0.5, grad: [0.6, 1.15] });
    }
  }
  function vending(b, ctx, x, z, yaw, col, o) {
    o = o || {};
    var m = at(x, 0, z, yaw || 0);
    b.add(G.roundBox(0.72, 1.62, 0.62, 0.03, 1), { m: m, c: col, cls: C.METAL });
    /* lit display of drinks: SHOP glass with a bright interior */
    b.add(G.quad(0.52, 0.82), { m: under(m, at(-0.05, 0.7, 0.315)), c: [0.6, 0.62, 1], cls: C.SHOP, seed: nextSeed() });
    b.add(G.box(0.12, 0.3, 0.02), { m: under(m, at(0.27, 0.9, 0.32)), c: [0.2, 0.2, 0.2], cls: C.METAL });
    b.add(G.box(0.5, 0.14, 0.02), { m: under(m, at(-0.05, 0.25, 0.32)), c: [0.05, 0.05, 0.05], cls: C.METAL });
    b.add(G.box(0.6, 0.12, 0.02), { m: under(m, at(0, 1.5, 0.32)), c: o.stripe || [1, 1, 1], cls: C.NEON });
    if (ctx) { var p = AL.math.apply(m, 0, 1.0, 0.7, [0, 0, 0, 0]); ctx.light(p[0], p[1], p[2], o.light || [0.75, 0.85, 1.0], 1.0, 2.2, 'vend'); }
  }
  function trashBin(b, x, z, col) {
    var op = offPath(x, z, 0.2); x = op[0]; z = op[1];
    b.add(G.lathe([[0.2, 0], [0.22, 0.65], [0.2, 0.67]], 10, true), { m: at(x, 0, z), c: col || [0.15, 0.2, 0.18], cls: C.METAL });
    b.add(G.lathe([[0.23, 0], [0.18, 0.08], [0.02, 0.1]], 10, true), { m: at(x, 0.67, z), c: shade(col || [0.15, 0.2, 0.18], 0.8), cls: C.METAL });
  }
  function hydrant(b, x, z, col) {
